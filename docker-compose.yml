services:
  postgres:
    image: postgres:15-alpine
    container_name: ledger-postgres
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ledger_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ledger-network
    restart: unless-stopped

  ledger-service:
    image: eclipse-temurin:21-jdk-alpine
    container_name: ledger-service
    working_dir: /app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger_db
      SPRING_DATASOURCE_USERNAME: ledger_user
      SPRING_DATASOURCE_PASSWORD: ledger_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./target/MVP-0.0.1-SNAPSHOT.jar:/app/app.jar
    depends_on:
      - postgres
    networks:
      - ledger-network
    command: sh -c "sleep 15 && java -jar /app/app.jar"
    restart: unless-stopped

  ledger-lb:
    image: nginx:alpine
    container_name: ledger-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ledger-service
    networks:
      - ledger-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  ledger-network:
    driver: bridge
