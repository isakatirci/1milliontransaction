user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript;

    # Upstream backend servers
    upstream ledger_backend {
        ip_hash;
        server ledger-service:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Rate limiting (Loosened for stress testing)
    limit_req_zone $binary_remote_addr zone=ledger_limit:10m rate=10000r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    server {
        listen 80;
        server_name _;

        client_body_timeout 30s;
        client_header_timeout 30s;
        send_timeout 30s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Rate limiting
        limit_req zone=ledger_limit burst=5000 nodelay;
        limit_conn addr 1000;

        # Nginx Basic Status
        location /nginx_status {
            stub_status on;
            access_log off;
            allow all; # In production, restrict this to your IP
        }

        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://ledger_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # Actuator endpoints
        location /actuator {
            access_log off;
            proxy_pass http://ledger_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # API endpoints
        location /api/ {
            limit_req zone=ledger_limit burst=5000 nodelay;

            proxy_pass http://ledger_backend;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Connection reuse
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 600s; # Increased for long-running stress tests

            # SSE Support
            proxy_set_header X-Accel-Buffering no;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # Retries
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }

        # Stress Test UI
        location /stress-test {
            proxy_pass http://ledger_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            
            # SSE Support for progress updates
            proxy_set_header X-Accel-Buffering no;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # Transfer Form UI
        location /transfer-form {
            proxy_pass http://ledger_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        # Swagger UI and OpenAPI Docs
        location /swagger-ui/ {
            proxy_pass http://ledger_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        location /v3/api-docs {
            proxy_pass http://ledger_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        # Default
        location / {
            return 404;
        }
    }
}
