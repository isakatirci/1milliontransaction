services:
  postgres:
    image: postgres:15-alpine
    container_name: ledger-postgres
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ledger_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ledger-network
    restart: unless-stopped

  ledger-lb:
    image: nginx:alpine
    container_name: ledger-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx-local.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ledger-network
    restart: unless-stopped

  lb-stats:
    image: allinurl/goaccess
    container_name: ledger-lb-stats
    restart: always
    ports:
      - "7890:7890"
    volumes:
      - nginx_logs:/opt/goaccess/logs
    command: -f /opt/goaccess/logs/access.log --log-format=COMBINED --real-time-html
    networks:
      - ledger-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: ledger-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ledger.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - ledger-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ledger-prometheus
    volumes:
      - ./prometheus-local.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    networks:
      - ledger-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ledger-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - ledger-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  ledger-network:
    driver: bridge
