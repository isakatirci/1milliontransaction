<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVP Ledger | Transfer Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --success: #22c55e;
            --fail: #ef4444;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --input-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.05em;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 2.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.875rem 1rem;
            border-radius: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .btn {
            background: linear-gradient(to right, #38bdf8, #818cf8);
            color: var(--bg);
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--accent-glow);
        }

        .btn:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Spinner Styles */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 2.5rem;
            width: 90%;
            max-width: 400px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 1.5rem;
            font-size: 2.5rem;
        }

        .modal-icon.success {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
            border: 2px solid var(--success);
        }

        .modal-icon.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--fail);
            border: 2px solid var(--fail);
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .modal-body {
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .modal-btn {
            background: var(--border);
            color: var(--text);
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn:hover {
            background: var(--text-muted);
            color: var(--bg);
        }

        /* Blur effect on card during loading */
        .card.loading {
            pointer-events: none;
        }
        
        .card.loading::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(2px);
            z-index: 10;
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>NEW TRANSACTION</h1>
            <p class="subtitle">Securely transfer funds between accounts</p>
        </header>

        <div class="card" id="formCard">
            <form id="transferForm">
                <div class="form-group">
                    <label for="fromAccount">From Account</label>
                    <input type="text" id="fromAccount" name="fromAccount" placeholder="e.g. ACC001" required>
                </div>
                
                <div class="form-group">
                    <label for="toAccount">To Account</label>
                    <input type="text" id="toAccount" name="toAccount" placeholder="e.g. ACC002" required>
                </div>
                
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount" placeholder="0.00" min="0.01" step="0.01" required>
                </div>

                <button type="submit" class="btn" id="submitBtn">
                    <span id="btnText">Execute Transfer</span>
                    <div class="spinner" id="btnSpinner"></div>
                </button>
            </form>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal">
            <div class="modal-icon" id="modalIcon">
                <!-- SVG injected via JS -->
            </div>
            <h2 class="modal-title" id="modalTitle">Status</h2>
            <div class="modal-body" id="modalMessage">
                Message goes here.
            </div>
            <button class="modal-btn" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('transferForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const formCard = document.getElementById('formCard');
        
        const modal = document.getElementById('resultModal');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');

        const successIcon = '✓';
        const errorIcon = '✕';

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // UI State: Loading
            submitBtn.disabled = true;
            btnText.style.display = 'none';
            btnSpinner.style.display = 'block';
            formCard.classList.add('loading');

            const formData = {
                fromAccount: document.getElementById('fromAccount').value,
                toAccount: document.getElementById('toAccount').value,
                amount: parseFloat(document.getElementById('amount').value)
            };

            // TODO: Replace this setTimeout with your actual fetch call
            // fetch('/api/v1/transfer', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify(formData)
            // })
            // .then(response => response.json())
            // .then(data => showModal(true, "Transfer Successful", `Successfully transferred $${formData.amount} from ${formData.fromAccount} to ${formData.toAccount}.`))
            // .catch(error => showModal(false, "Transfer Failed", error.message));

            // SIMULATING API CALL FOR 2 SECONDS
            setTimeout(() => {
                // Randomly succeed or fail for demonstration
                const isSuccess = Math.random() > 0.3;
                
                if (isSuccess) {
                    showModal(true, "Transfer Successful", `Successfully transferred $${formData.amount} from ${formData.fromAccount} to ${formData.toAccount}.`);
                    form.reset();
                } else {
                    showModal(false, "Transfer Failed", "Insufficient funds or service unavailable. Please try again.");
                }
                
                // Reset UI State
                submitBtn.disabled = false;
                btnText.style.display = 'block';
                btnSpinner.style.display = 'none';
                formCard.classList.remove('loading');

            }, 2000);
        });

        function showModal(isSuccess, title, message) {
            modalIcon.className = 'modal-icon ' + (isSuccess ? 'success' : 'error');
            modalIcon.innerHTML = isSuccess ? successIcon : errorIcon;
            modalTitle.innerText = title;
            modalMessage.innerText = message;
            
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }
    </script>
</body>
</html>
