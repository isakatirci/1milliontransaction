spring:
  application:
    name: ledger-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        generate_statistics: false
        jdbc:
          batch_size: 50
          fetch_size: 1000
        order_inserts: true
        order_updates: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledger_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  hikari:
    maximum-pool-size: 10
    minimum-idle: 10
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000
    auto-commit: true
    leak-detection-threshold: 30000
  sql:
    init:
      mode: always
      continue-on-error: true
      platform: postgresql

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10
    max-connections: 10000
    accept-count: 100
    connection-timeout: 20000ms

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    db:
      enabled: true
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    tags:
      application: ledger-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
        method.execution.time: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99
        method.execution.time: 0.5, 0.9, 0.95, 0.99
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    com.isakatirci.MVP: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [${spring.application.name:-},%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

# Settlement relay (disabled by default for MVP)
outbox:
  relay:
    enabled: false
    poll-interval-ms: 500

settlement:
  service:
    url: ${SETTLEMENT_SERVICE_URL:http://settlement:8081/settle}
